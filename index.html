    bell: 'M10 14L15.5 14L15.5 12L14.118 12L13.7516 11.2672C13.5771 10.918 13.4758 10.5368 13.4542 10.147L13.2203 5.93837C13.0854 3.50893 11.3068 1.54301 9 1.09569V0H7V1.09569C4.69318 1.543 2.91463 3.50892 2.77966 5.93837L2.54585 10.147C2.52419 10.5368 2.42295 10.918 2.24835 11.2672L1.88197 12H0.5V14L6 14C6 15.1046 6.89543 16 8 16C9.10457 16 10 15.1046 10 14ZM11.8857 12L4.11434 12C4.36381 11.4514 4.50928 10.8607 4.54277 10.2579L4.77658 6.04931C4.87162 4.33853 6.28658 3 8 3C9.71341 3 11.1284 4.33853 11.2234 6.04931L11.4572 10.2579C11.4907 10.8607 11.6362 11.4514 11.8857 12Z'
  };
  const icon = name => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="${P[name]}"/></svg>`;
  const ALERT_ICON = {default: 'bell', info: 'info', success: 'check', warning: 'minus', danger: 'exclamation'};
  const KIND = {note: 'info', info: 'info', abstract: 'info', summary: 'info', tip: 'success', success: 'success', check: 'success', done: 'success',
    warning: 'warning', caution: 'warning', attention: 'warning', question: 'warning', help: 'warning', faq: 'warning',
    danger: 'danger', error: 'danger', failure: 'danger', bug: 'danger', important: 'default', example: 'default', quote: 'default'};

  let list = [];
  const cache = {};

  /* ---------- Page theme (Light / Dark / Crimson) ----------
     One attribute on <html> drives the whole page: data-theme switches the site variables, and the matching
     .rvt-theme-* class switches every --rvt- semantic token from generated/rivet-tokens.css. Remembered per browser. */
  /* Tab order and the starting theme for every example page: Dark, then Crimson, then Light. */
  const THEMES = [{id: 'dark', label: 'Dark'}, {id: 'crimson', label: 'Crimson'}, {id: 'light', label: 'Light'}];
  const DEFAULT_THEME = 'dark';
  function getTheme() {
    return document.documentElement.dataset.theme || DEFAULT_THEME;
  }
  /* The chosen theme lives only on the page that has the switcher: route() clears it when you leave. */
  function setTheme(id) {
    if (!THEMES.some(t => t.id === id)) id = DEFAULT_THEME;
    const root = document.documentElement;
    root.dataset.theme = id;
    root.dataset.pageTheme = id;
    delete root.dataset.systemTheme;
    THEMES.forEach(t => root.classList.toggle('rvt-theme-' + t.id, t.id === id));
    headerTheme(id);
    document.querySelectorAll('.rvt-tabs--theme .rvt-tabs__tab').forEach(tab => {
      const on = tab.dataset.theme === id;
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
    });
  }
  /* Pages without a theme switcher follow the system light/dark setting: the same .rvt-theme-* class, data-page-theme and header
     theme as a chosen theme, so the hero, sidebar, header, notes and every --rvt- token switch with it. data-system-theme marks it as
     the system's choice, so entering a page with a switcher still starts on Dark. */
  const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function clearTheme() {
    const root = document.documentElement;
    delete root.dataset.theme;
    const sys = systemDark && systemDark.matches ? 'dark' : 'light';
    root.dataset.pageTheme = sys;
    root.dataset.systemTheme = '';
    THEMES.forEach(t => root.classList.toggle('rvt-theme-' + t.id, t.id === sys));
    headerTheme(sys);
  }
  if (systemDark) systemDark.addEventListener('change', () => { if ('systemTheme' in document.documentElement.dataset) clearTheme(); });
  /* The header carries its own .rvt-theme-* class so its tokens resolve to the page theme; with no page theme it matches the guide's dark frame. */
  function headerTheme(id) {
    const h = document.getElementById('site-header');
    THEMES.forEach(t => h.classList.toggle('rvt-theme-' + t.id, t.id === id));
  }
  /* rvt-tabs, Segmented: one tab per theme. Arrow keys move between tabs, Home/End jump, Enter/Space select. */
  const themeTabs = () => `<span class="demo-switch-label" id="theme-switch-label">Switch theme</span>
    <div class="rvt-tabs rvt-tabs--segmented rvt-tabs--theme" role="tablist" aria-labelledby="theme-switch-label">${THEMES.map(t =>
    `<button class="rvt-tabs__tab" type="button" role="tab" id="theme-tab-${t.id}" data-theme="${t.id}" data-label="${t.label}" aria-selected="${getTheme() === t.id}" aria-controls="demo-stage" tabindex="${getTheme() === t.id ? 0 : -1}">${t.label}</button>`).join('')}</div>`;
  function wireThemeTabs(root) {
    const listEl = root.querySelector('.rvt-tabs--theme');
    if (!listEl) return;
    const tabs = [...listEl.querySelectorAll('[role="tab"]')];
    listEl.addEventListener('click', e => {
      const tab = e.target.closest('[role="tab"]');
      if (tab) setTheme(tab.dataset.theme);
    });
    listEl.addEventListener('keydown', e => {
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      const next = {ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: tabs.length - 1}[e.key];
      if (next === undefined) return;
      e.preventDefault();
      const t = tabs[(next + tabs.length) % tabs.length];
      t.focus();
      setTheme(t.dataset.theme);
    });
  }

  /* ---------- Component examples, one builder per slug ----------
     Each returns the markup for the example stage; wire() adds the behaviour after it is in the page. */
  const ACCORDION_ITEMS = [
    {title: 'How do I request an official transcript?', open: true, body: '<p>Order transcripts through One.IU under <a href="#">Student Records</a>. Electronic copies usually arrive within one business day; mailed copies take five to seven.</p>'},
    {title: 'When is the application deadline?', body: '<p>Early action applications are due November 1. The regular deadline is February 1 for fall admission.</p>'},
    {title: 'Can I change my major after I enroll?', body: '<p>Yes. Most schools let you declare or change a major through your academic advisor once you have completed your first semester.</p>'},
    {title: 'What financial aid is available?', body: '<p>File the FAFSA by April 15 to be considered for grants, scholarships, work-study and loans.</p>'}
  ];

  /* rvt-alert example. 16px glyphs reuse P; the Inline badge uses the 12px Rivet glyphs. */
  const P12 = {
    info: 'M7 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0M5 4h2v7H5z',
    check: 'm11.537 2.979-7.47 7.47L.462 6.245 1.98 4.943l2.2 2.565 5.944-5.944z',
    minus: 'M11 5v2H1V5z',
    exclamation: 'M7 10a1 1 0 1 1-2 0 1 1 0 0 1 2 0M5 1h2v7H5z',
    bell: 'M8 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0M8 5a2 2 0 1 0-4 0v1.764c0 .31-.072.617-.21.894L3.617 8h4.764l-.171-.342A2 2 0 0 1 8 6.764zm2 1.764L10.618 8H12v2H0V8h1.382L2 6.764V5a4 4 0 0 1 3-3.874V0h2v1.126c1.725.444 3 2.01 3 3.874z',
    close: 'M10.854 2.56 7.414 6l3.44 3.44-1.415 1.414L6 7.414l-3.44 3.44-1.414-1.415L4.586 6l-3.44-3.44 1.415-1.414L6 4.586l3.44-3.44z'
  };
  const icon12 = name => `<svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="${P12[name]}"/></svg>`;
  /* Status order follows the component: Info, Success, Warning, Danger, Default. Only Info and Success can be dismissed. */
  const ALERTS = [
    {status: 'info', word: 'Info', glyph: 'info', close: true, title: 'New advising hours',
      desc: 'Advising now meets Monday through Thursday, 9 a.m. to 6 p.m., in Wells Library.',
      list: ['Walk-ins are welcome until 4 p.m.', 'Virtual appointments are on Fridays', 'Bring your student ID'],
      actions: ['Book an appointment', 'See all hours'], inline: 'Advising hours changed for fall.'},
    {status: 'success', word: 'Success', glyph: 'check', close: true, title: 'Application submitted',
      desc: 'We received your application for fall admission. A confirmation email is on its way.',
      list: ['Application fee paid', 'Transcript received', 'Essay uploaded'],
      actions: ['View application status', 'Print summary'], inline: 'Your email address was saved.'},
    {status: 'warning', word: 'Warning', glyph: 'minus', title: 'Deadline is coming up',
      desc: 'Early action applications are due November 1. Finish these steps to be considered.',
      list: ['Send your high school transcript', 'Add one letter of recommendation', 'Pay the application fee'],
      actions: ['Finish application', 'Review checklist'], inline: 'Your session ends in 5 minutes.'},
    {status: 'danger', word: 'Error', glyph: 'exclamation', title: 'Payment didn’t go through',
      desc: 'We couldn’t process your enrollment deposit. Update your payment method to hold your spot.',
      list: ['Check the card number and expiration date', 'Confirm your billing address', 'Try a different payment method'],
      actions: ['Update payment', 'Contact the Bursar'], inline: 'Enter a valid IU email address.'},
    {status: 'default', word: 'Notice', glyph: 'bell', title: 'Offices closed November 26–27',
      desc: 'IU Bloomington offices close for Thanksgiving. Online services stay open.',
      list: ['Bursar payments still post online', 'Libraries keep reduced hours', 'Advising reopens November 30'],
      actions: ['See holiday hours', 'View campus calendar'], inline: 'Offices close at noon on Friday.'}
  ];
  const closeBtn = (a, size) => a.close ? `<button class="rvt-alert__close" type="button" aria-label="Dismiss ${esc(a.word.toLowerCase())} alert">${size === 12 ? icon12('close') : `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="${P.close}"/></svg>`}</button>` : '';
  const alertBlock = (a, cta) => `
    <div class="rvt-alert rvt-alert--${a.status}" role="region" aria-labelledby="alert-title-${a.status}" tabindex="-1">
      <div class="rvt-alert__block">
        <div class="rvt-alert__head">
          <span class="rvt-alert__badge" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="${P[a.glyph]}"/></svg></span>
          <h3 class="rvt-alert__title" id="alert-title-${a.status}"><span class="sr-only">${esc(a.word)}: </span>${esc(a.title)}</h3>
        </div>
        <p class="rvt-alert__desc">${esc(a.desc)}</p>
      </div>
      <ul class="rvt-alert__list">${a.list.map(li => `<li>${esc(li)}</li>`).join('')}</ul>
      ${cta ? `<div class="rvt-alert__actions"><button class="rvt-alert__btn rvt-alert__btn--primary" type="button">${esc(a.actions[0])}</button><button class="rvt-alert__btn rvt-alert__btn--secondary" type="button">${esc(a.actions[1])}</button></div>` : ''}
      ${closeBtn(a, 16)}
    </div>`;
  const alertInline = a => `
    <div class="rvt-alert rvt-alert--inline rvt-alert--${a.status}${a.close ? ' has-close' : ''}" tabindex="-1">
      <span class="rvt-alert__slot" aria-hidden="true"><span class="rvt-alert__badge">${icon12(a.glyph)}</span></span>
      <p class="rvt-alert__message"><span class="sr-only">${esc(a.word)}: </span>${esc(a.inline)}</p>
      ${closeBtn(a, 12)}
    </div>`;
  /* rvt-badge example. Status order follows the component: Default, Info, Success, Warning, Danger.
     Default uses rvt-star-12 (swappable); the others reuse the 12px Rivet glyphs in P12. Icon Only badges carry their label for screen readers. */
  P12.star = 'm7.7 4.113 4.319.204L8.821 7.41l1.024 4.029L6 9.459l-3.845 1.979 1.023-4.029-3.197-3.092 4.32-.204L6 .563zM5.846 5.517l-.258.539-.888.042.704.68-.144.562-.074.289.356-.183L6 7.211l.813.418-.073-.29-.144-.56.418-.404.286-.277-.888-.042L6 5.194z';
  const BADGES = [
    {status: 'default', glyph: 'star', label: 'Online'},
    {status: 'info', glyph: 'info', label: 'New'},
    {status: 'success', glyph: 'check', label: 'Open'},
    {status: 'warning', glyph: 'minus', label: 'Closing soon'},
    {status: 'danger', glyph: 'exclamation', label: 'Full'}
  ];
  const badgeEl = (b, style, iconOnly) => {
    const cls = `rvt-badge rvt-badge--${b.status}${style === 'subtle' ? ' rvt-badge--subtle' : ''}${iconOnly ? ' rvt-badge--icon-only' : ''}`;
    return iconOnly
      ? `<span class="${cls}">${icon12(b.glyph)}<span class="sr-only">${esc(b.label)}</span></span>`
      : `<span class="${cls}">${icon12(b.glyph)}${esc(b.label)}</span>`;
  };
  const demos = {
    accordion: {
      maxWidth: 850, // Figma rvt-accordion, Breakpoint=Desktop frame width
      html: () => `<div class="rvt-accordion" data-rvt-accordion>${ACCORDION_ITEMS.map((it, i) => `
        <div class="rvt-accordion__item">
          <h3 class="rvt-accordion__heading">
            <button class="rvt-accordion__trigger" type="button" id="acc-trigger-${i}" aria-expanded="${!!it.open}" aria-controls="acc-panel-${i}">
              <span class="rvt-accordion__title">${esc(it.title)}</span>
              <span class="rvt-accordion__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M15 9H1V7H15V9Z"/><path class="is-plus" d="M9 1V7H15V9H9V15H7V9H1V7H7V1H9Z"/></svg></span>
            </button>
          </h3>
          <div class="rvt-accordion__panel${it.open ? ' is-open' : ''}" id="acc-panel-${i}" role="region" aria-labelledby="acc-trigger-${i}"${it.open ? '' : ' aria-hidden="true"'}>
            <div><div class="rvt-accordion__body">${it.body}</div></div>
          </div>
        </div>`).join('')}</div>`,
      wire: root => {
        const acc = root.querySelector('[data-rvt-accordion]');
        if (!acc) return;
        const triggers = [...acc.querySelectorAll('.rvt-accordion__trigger')];
        const toggle = (btn, open) => {
          const panel = document.getElementById(btn.getAttribute('aria-controls'));
          btn.setAttribute('aria-expanded', String(open));
          panel.classList.toggle('is-open', open);
          if (open) panel.removeAttribute('aria-hidden'); else panel.setAttribute('aria-hidden', 'true');
        };
        acc.addEventListener('click', e => {
          const btn = e.target.closest('.rvt-accordion__trigger');
          if (btn) toggle(btn, btn.getAttribute('aria-expanded') !== 'true');
        });
        acc.addEventListener('keydown', e => {
          const i = triggers.indexOf(document.activeElement);
          if (i < 0) return;
          const next = {ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: triggers.length - 1}[e.key];
          if (next === undefined) return;
          e.preventDefault();
          triggers[(next + triggers.length) % triggers.length].focus();
        });
      }
    },
    /* Components with more than one variant list them in `variants`; the example adds a "Select variant" dropdown next to the theme tabs.
       A variant can carry its own maxWidth (its Desktop frame width); html(variantId) builds the stage for that variant. */
    alert: {
      maxWidth: 1400, // Figma rvt-alert, Breakpoint=Desktop, Type=Default and CTA frame width
      variants: [
        {id: 'default', label: 'Default'},
        {id: 'cta', label: 'CTA'},
        {id: 'inline', label: 'Inline', maxWidth: 520} // Figma rvt-alert, Breakpoint=Desktop, Type=Inline frame width
      ],
      html: v => `<div class="rvt-alert-stack">${ALERTS.map(a => v === 'inline' ? alertInline(a) : alertBlock(a, v === 'cta')).join('')}</div>`,
      wire: stage => {
        stage.querySelectorAll('.rvt-alert__close').forEach(btn => btn.addEventListener('click', () => {
          const alert = btn.closest('.rvt-alert');
          alert.hidden = true;
          /* Move focus to the next alert still showing, or the stage, so keyboard users don't lose their place. */
          const rest = [...stage.querySelectorAll('.rvt-alert:not([hidden])')];
          (rest.find(el => alert.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) || rest[0] || stage).focus();
        }));
      }
    },
    /* rvt-badge: Style is the variant; each status shows on its own row, Default layout (icon + label) then Icon Only.
       Badges hug their content, so the cap is the Figma theme showcase row width (the component has no Breakpoint=Desktop frame). */
    badge: {
      maxWidth: 492, // Figma Badge page, theme-showcase "Badges" row width (no Breakpoint=Desktop frame)
      variants: [
        {id: 'strong', label: 'Strong'},
        {id: 'subtle', label: 'Subtle'}
      ],
      html: v => `<div class="rvt-badge-rows">${BADGES.map(b => `<p class="rvt-badge-row">${badgeEl(b, v, false)}${badgeEl(b, v, true)}</p>`).join('')}</div>`
    }
  };
  const demoSection = c => {
    const d = demos[c.slug];
    if (!d) return '';
    const v = d.variants ? d.variants[0] : null; // every visit starts on the first variant
    const max = (v && v.maxWidth) || d.maxWidth;
    return `<section class="demo" aria-labelledby="demo-title">
      <h2 class="demo-title" id="demo-title">Example</h2>
      <p class="demo-note">Shows how I envision the component in all its glory. 🤘</p>
      <div class="demo-controls">
        <div class="demo-control">${themeTabs()}</div>
        ${v ? `<div class="demo-control">${variantSelect(d, v)}</div>` : ''}
      </div>
      <div class="demo-stage" id="demo-stage" role="tabpanel" tabindex="-1" aria-label="${esc(c.name)} example"${max ? ` style="--demo-max:${max}px"` : ''}>${d.html(v && v.id)}</div>
    </section>`;
  };

  /* ---------- Markdown helpers ---------- */
  function preprocess(md) {
    md = md.replace(/^﻿/, '').replace(/^---\n[\s\S]*?\n---\n/, '');
    md = md.replace(/^#\s+.*\n+/, '');
    md = md.replace(/%%[\s\S]*?%%/g, '');
    md = md.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
    md = md.replace(/!\[\[([^\]]+)\]\]/g, '');
    md = md.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, target, alias) => {
      const t = target.trim();
      const hit = list.find(c => c.name.toLowerCase() === t.toLowerCase() || c.slug === t.toLowerCase());
      const text = alias || t;
      return hit ? `[${text}](#${hit.slug})` : text;
    });
    return md;
  }

  function enhance(root) {
    // Tables: name each from its preceding heading, mark column + row headers, make the scroll box keyboard-reachable
    root.querySelectorAll('table').forEach((t, i) => {
      let h = t.previousElementSibling;
      while (h && !/^H[2-4]$/.test(h.tagName)) h = h.previousElementSibling;
      const w = document.createElement('div'); w.className = 'table-wrap';
      w.setAttribute('role', 'region'); w.tabIndex = 0;
      if (h) { if (!h.id) h.id = 'tbl-h-' + i; t.setAttribute('aria-labelledby', h.id); w.setAttribute('aria-labelledby', h.id); }
      else { w.setAttribute('aria-label', 'Table ' + (i + 1)); }
      t.querySelectorAll('thead th').forEach(th => th.setAttribute('scope', 'col'));
      t.querySelectorAll('tbody tr').forEach(tr => {
        const td = tr.firstElementChild;
        if (td && td.tagName === 'TD') { const th = document.createElement('th'); th.setAttribute('scope', 'row'); th.innerHTML = td.innerHTML; td.replaceWith(th); }
      });
      t.replaceWith(w); w.appendChild(t);
    });
    root.querySelectorAll('tbody code').forEach(c => { if (c.children.length === 0 && c.textContent.includes('/')) c.innerHTML = esc(c.textContent).replace(/\//g, '/<wbr>'); });
    root.querySelectorAll('code').forEach(c => {
      if (c.closest('pre')) return;
      const m = c.textContent.trim().match(/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (m) { const s = document.createElement('span'); s.className = 'sw'; s.style.background = m[0]; c.prepend(s); }
    });
    // Obsidian callouts -> rvt-alert
    root.querySelectorAll('blockquote').forEach(bq => {
      const first = bq.querySelector('p');
      if (!first) return;
      const m = first.innerHTML.match(/^\[!(\w+)(?:\|(\w+))?\][+-]?\s*([^\n<]*)(?:\n|<br>)?/i);
      if (!m) return;
      const raw = m[1].toLowerCase();
      const kind = KIND[raw] || 'info';
      const title = m[3].trim() || raw.charAt(0).toUpperCase() + raw.slice(1);
      first.innerHTML = first.innerHTML.slice(m[0].length).trim();
      if (!first.innerHTML) first.remove();
      const box = document.createElement('div');
      /* Every callout renders with the real rvt-alert component (same markup and CSS as the Alert example) and follows the page theme. */
      box.className = `rvt-alert rvt-alert--${kind} rvt-alert--note`; box.setAttribute('role', 'note');
      box.innerHTML = `<div class="rvt-alert__block"><div class="rvt-alert__head"><span class="rvt-alert__badge" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="${P[ALERT_ICON[kind]]}"/></svg></span><p class="rvt-alert__title">${esc(title)}</p></div></div>`;
      const block = box.firstElementChild;
      [...bq.children].forEach((el, i) => {
        if (el.tagName === 'UL') { el.className = 'rvt-alert__list'; box.appendChild(el); }
        else { el.classList.add('rvt-alert__desc'); (i === 0 && el.tagName === 'P' ? block : box).appendChild(el); }
      });
      bq.replaceWith(box);
    });
    // Do / Don't
    const isDo = t => /^do['’]?s?$/i.test(t.trim());
    const isDont = t => /^don['’]?t'?s?$/i.test(t.trim()) || /^do not$/i.test(t.trim());
    let group = null;
    [...root.querySelectorAll('h3, h4')].forEach(h => {
      const txt = h.textContent;
      if (!isDo(txt) && !isDont(txt)) { group = null; return; }
      const card = document.createElement('div');
      card.className = 'dd-card' + (isDont(txt) ? ' dont' : '');
      const h3 = document.createElement('h3');
      h3.innerHTML = `<span class="alert-ic">${icon(isDont(txt) ? 'close' : 'check')}</span><span>${esc(txt.trim())}</span>`;
      card.appendChild(h3);
      let n = h.nextElementSibling;
      while (n && !/^H[1-4]$/.test(n.tagName) && !n.classList.contains('dd')) { const next = n.nextElementSibling; card.appendChild(n); n = next; }
      if (group && group.nextElementSibling === h) { h.remove(); group.appendChild(card); }
      else { group = document.createElement('div'); group.className = 'dd'; h.replaceWith(group); group.appendChild(card); }
    });
  }

  /* ---------- Component rail ---------- */
  const CHEV = 'M6.263 15.146 12.31 8 6.263.854 4.737 2.146 9.69 8l-4.953 5.854 1.526 1.292Z';
  const MENU = 'M15 4H1V2H15V4ZM15 9H1V7H15V9ZM1 14H15V12H1V14Z';
  let railToggle, railPanel, railNav;
  const desktop = window.matchMedia('(min-width: 1024px)');
  function buildRail() {
    const shell = document.createElement('div');
    shell.id = 'rail-shell';
    shell.innerHTML = `
      <nav id="rail" aria-label="All components"><div id="rail-nav">
        <a class="rail-title" href="#"><span class="rail-title-label">Components</span></a>
        <ul>${list.map(c => `<li><a class="rail-item" href="#${esc(c.slug)}" data-slug="${esc(c.slug)}"><span class="rail-label">${esc(c.name)}</span><span class="rail-chev" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="${CHEV}"/></svg></span></a></li>`).join('')}</ul>
      </div></nav>`;
    app.parentNode.insertBefore(shell, app);
    document.getElementById('rail-toggle').hidden = false;
    railToggle = document.getElementById('rail-toggle');
    railPanel = document.getElementById('rail');
    railNav = document.getElementById('rail-nav');
    railToggle.addEventListener('click', () => setRailOpen(railToggle.getAttribute('aria-expanded') !== 'true'));
    shell.addEventListener('keydown', e => {
      if (e.key === 'Escape' && railToggle.getAttribute('aria-expanded') === 'true') { setRailOpen(false); railToggle.focus(); }
    });
    desktop.addEventListener('change', () => setRailOpen(false));
  }
  function setRailOpen(open) {
    if (!railToggle) return;
    railToggle.setAttribute('aria-expanded', String(open));
    railPanel.classList.toggle('is-open', open);
    railPanel.style.maxHeight = open ? railNav.offsetHeight + 'px' : '';
  }
  function markRail(slug) {
    if (!railPanel) return;
    let cur = null;
    railPanel.querySelectorAll('.rail-item').forEach(a => {
      const on = a.dataset.slug === slug;
      if (on) { a.setAttribute('aria-current', 'page'); cur = a; } else a.removeAttribute('aria-current');
    });
    // Keep the current component in view inside the rail (desktop rail scrolls on its own).
    if (cur && desktop.matches) {
      const top = cur.offsetTop, h = cur.offsetHeight, st = railPanel.scrollTop, ch = railPanel.clientHeight;
      if (top < st || top + h > st + ch) railPanel.scrollTop = Math.max(0, top - ch / 2 + h / 2);
    }
  }

    const onDoc = slug !== 'token-changes' && !!c;
    /* Page theme switcher: only pages with an example have one. Entering such a page starts on Dark; leaving it clears the choice. */
    if (c && demos[c.slug]) { const ds = document.documentElement.dataset; if (!ds.pageTheme || 'systemTheme' in ds) setTheme(DEFAULT_THEME); }
    else clearTheme();
    document.body.classList.toggle('has-rail', onDoc);
    setRailOpen(false);
    markRail(onDoc ? c.slug : null);
    if (slug === 'token-changes') renderTokens(); else if (slug === 'text-styles' || slug === 'token-details') renderTextStyles(slug === 'token-details'); else if (c) renderDoc(c); else renderIndex();
    window.scrollTo(0, 0);
  }

  loadManifest().then(() => { buildRail(); route(); window.addEventListener('hashchange', route); })
    .catch(() => { app.innerHTML = '<div class="wrap load">The component list could not be loaded. Try reloading the page.</div>'; });
})();
</script>
