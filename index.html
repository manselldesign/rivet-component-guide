.rvt-badge--subtle{--badge-bg:var(--rvt-component-badge-default-subtle-background);--badge-border:var(--rvt-component-badge-default-subtle-border);--badge-text:var(--rvt-component-badge-default-subtle-text);--badge-icon:var(--rvt-component-badge-default-subtle-icon)}
.rvt-badge--subtle.rvt-badge--info{--badge-bg:var(--rvt-component-badge-info-subtle-background);--badge-border:var(--rvt-component-badge-info-subtle-border);--badge-text:var(--rvt-component-badge-info-subtle-text);--badge-icon:var(--rvt-component-badge-info-subtle-icon)}
.rvt-badge--subtle.rvt-badge--success{--badge-bg:var(--rvt-component-badge-success-subtle-background);--badge-border:var(--rvt-component-badge-success-subtle-border);--badge-text:var(--rvt-component-badge-success-subtle-text);--badge-icon:var(--rvt-component-badge-success-subtle-icon)}
.rvt-badge--subtle.rvt-badge--warning{--badge-bg:var(--rvt-component-badge-warning-subtle-background);--badge-border:var(--rvt-component-badge-warning-subtle-border);--badge-text:var(--rvt-component-badge-warning-subtle-text);--badge-icon:var(--rvt-component-badge-warning-subtle-icon)}
.rvt-badge--subtle.rvt-badge--danger{--badge-bg:var(--rvt-component-badge-danger-subtle-background);--badge-border:var(--rvt-component-badge-danger-subtle-border);--badge-text:var(--rvt-component-badge-danger-subtle-text);--badge-icon:var(--rvt-component-badge-danger-subtle-icon)}

/* ---------- rvt-avatar (Avatar page example, Developer spec checklist) ----------
   Layout: Image, No Image (IU trident) or Initials. Sizes 32, 40, 48, 64, 80, 96, 128, 160, 224px, shown inline in one row, smallest first,
   spacing/16 apart and centered on each other; the row wraps on narrow screens. Fixed sizes, the same on Desktop and Mobile.
   Circle (border-radius/full) on background/brand-container; the photo covers the circle. Initials and trident use component/avatar/foreground.
   Initials: component avatar style for the size (weight 600, line height = size, width 100%, no axis adjustments). Trident: half the avatar's height.
   Avatar tokens are the same in Light, Dark and Crimson. */
.rvt-avatar-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--rvt-spacing-16);margin:0}
.rvt-avatar{box-sizing:border-box;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;
  width:var(--avatar-size);height:var(--avatar-size);border-radius:var(--rvt-border-radius-full);
  background:var(--rvt-background-brand-container);color:var(--rvt-component-avatar-foreground)}
.rvt-avatar img{display:block;width:100%;height:100%;object-fit:cover}
.rvt-avatar svg{display:block;height:50%;width:auto;fill:currentColor}
.rvt-avatar__initials{font-stretch:var(--rvt-font-width-normal);font-variation-settings:normal;letter-spacing:var(--rvt-font-tracking-none);text-align:center}
.rvt-avatar--32{--avatar-size:32px}.rvt-avatar--32 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-32);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--40{--avatar-size:40px}.rvt-avatar--40 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-40);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--48{--avatar-size:48px}.rvt-avatar--48 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-48);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--64{--avatar-size:64px}.rvt-avatar--64 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-64);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--80{--avatar-size:80px}.rvt-avatar--80 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-80);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--96{--avatar-size:96px}.rvt-avatar--96 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-96);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--128{--avatar-size:128px}.rvt-avatar--128 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-128);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--160{--avatar-size:160px}.rvt-avatar--160 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-160);font-stretch:var(--rvt-font-width-normal)}
.rvt-avatar--224{--avatar-size:224px}.rvt-avatar--224 .rvt-avatar__initials{font:var(--rvt-font-component-avatar-224);font-stretch:var(--rvt-font-width-normal)}

/* ---------- rvt-button (Button page example, Developer spec checklist) ----------
   Size is the variant (Extra-large, Large, Medium, Small); the Style radio (Strong, Normal, Subtle) sits beside it.
   One row: a label-only button, a leading icon, a trailing chevron (opens a menu), an icon-only button and a disabled button, spacing/24 apart.
   Each button has a small label under it in tag/sm/regular (12 / 16px, weight 350, Roboto Mono, 1px tracking) text/default, spacing/8 below the button.
   The label wraps to the button's width and never widens its slot (contain: inline-size), so the buttons stay exactly spacing/24 apart.
   Heights are fixed component/button/height-* tokens, the same on Desktop and Mobile. Square corners. Borders are drawn inside (box-shadow), so they never add size.
   Hover 150ms ease-out. Pressed: 2px border/on-brand-alt ring with a 2px component/button/form-border-hover ring inside it.
   Focus: 2px border/accent-strong, directly outside the box, square. Disabled: default colors at 40% opacity. */
.rvt-button-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--rvt-spacing-24);margin:0;padding:0;list-style:none}
.rvt-button-item{display:flex;flex-direction:column;align-items:flex-start;gap:var(--rvt-spacing-8);margin:0}
.rvt-button-item__label{display:block;align-self:stretch;contain:inline-size;margin:0;color:var(--rvt-text-default);
  font:var(--rvt-font-tag-sm-regular);font-stretch:var(--rvt-font-width-normal);letter-spacing:var(--rvt-font-tracking-lg)}
.rvt-button{--btn-bg:transparent;--btn-text:var(--rvt-component-button-form-text);--btn-ring:transparent;
  box-sizing:border-box;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--rvt-spacing-8);
  height:var(--btn-h);margin:0;padding:0 var(--btn-px);border:0;border-radius:0;
  background:var(--btn-bg);color:var(--btn-text);box-shadow:inset 0 0 0 1px var(--btn-ring);
  cursor:pointer;-webkit-appearance:none;appearance:none;white-space:nowrap;text-decoration:none;
  font:var(--rvt-font-action-lg-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);
  transition:background-color .15s ease-out,color .15s ease-out,box-shadow .15s ease-out}
.rvt-button svg{display:block;flex:none;width:16px;height:16px;fill:currentColor}
/* Size: Extra-large and Large use action/lg/strong and 16px icons; Medium and Small use action/sm/strong and 12px icons (icon-only Medium keeps 16px). */
.rvt-button--xl{--btn-h:var(--rvt-component-button-height-xl);--btn-px:var(--rvt-spacing-16)}
.rvt-button--lg{--btn-h:var(--rvt-component-button-height-lg);--btn-px:var(--rvt-spacing-16)}
.rvt-button--md{--btn-h:var(--rvt-component-button-height-md);--btn-px:var(--rvt-spacing-12)}
.rvt-button--sm{--btn-h:var(--rvt-component-button-height-sm);--btn-px:var(--rvt-spacing-8);gap:var(--rvt-spacing-4)}
.rvt-button--md,.rvt-button--sm{font:var(--rvt-font-action-sm-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-button--md svg,.rvt-button--sm svg{width:12px;height:12px}
.rvt-button--icon-only{width:var(--btn-h);padding:0}
.rvt-button--md.rvt-button--icon-only svg{width:16px;height:16px}
/* Style */
.rvt-button--strong{--btn-bg:var(--rvt-component-button-form-background);--btn-text:var(--rvt-text-on-brand-alt)}
.rvt-button--strong:hover:not(:disabled){--btn-bg:var(--rvt-component-button-form-background-hover)}
.rvt-button--strong:active:not(:disabled){--btn-bg:var(--rvt-component-button-form-background-hover)}
.rvt-button--normal{--btn-ring:var(--rvt-component-button-form-border)}
.rvt-button--normal:hover:not(:disabled){--btn-ring:var(--rvt-component-button-form-border-hover);--btn-text:var(--rvt-component-button-form-text-hover)}
.rvt-button--subtle{--btn-text:var(--rvt-component-button-form-text-subtle)}
.rvt-button--subtle:hover:not(:disabled){--btn-text:var(--rvt-component-button-form-text-hover)}
.rvt-button--normal:active:not(:disabled),.rvt-button--subtle:active:not(:disabled){--btn-bg:var(--rvt-background-strong)}
.rvt-button:active:not(:disabled){box-shadow:inset 0 0 0 2px var(--rvt-border-on-brand-alt),inset 0 0 0 4px var(--rvt-component-button-form-border-hover)}
.rvt-button:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:0}
.rvt-button:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.rvt-button{transition:none}}

/* ---------- rvt-calendar-tile (Calendar tile page example, Developer spec checklist) ----------
   128 x 128px fixed, spacing/16 padding, square corners, content centered and stacked spacing/12 apart.
   Colors are component/calendar-tile/background and /text, fixed across themes (the same tile on Light, Dark and Crimson).
   Month and Year: tag/lg/caps (16 / 24px, weight 350, Roboto Mono, 2px tracking, uppercase).
   Day: component/number/strong (42 / 44px, weight 825, Roboto Flex, width 150% (no width variable yet), no tracking), trimmed to cap height.
   The example row shows two tiles spacing/24 apart, each with a tag/sm/regular label under it that never widens its slot. */
.rvt-calendar-tile-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--rvt-spacing-24);margin:0;padding:0;list-style:none}
.rvt-calendar-tile-item{display:flex;flex-direction:column;align-items:flex-start;gap:var(--rvt-spacing-8);margin:0}
.rvt-calendar-tile-item__label{display:block;align-self:stretch;contain:inline-size;margin:0;color:var(--rvt-text-default);
  font:var(--rvt-font-tag-sm-regular);font-stretch:var(--rvt-font-width-normal);letter-spacing:var(--rvt-font-tracking-lg)}
.rvt-calendar-tile{box-sizing:border-box;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--rvt-spacing-12);width:128px;height:128px;padding:var(--rvt-spacing-16);overflow:hidden;border-radius:0;
  background:var(--rvt-component-calendar-tile-background);color:var(--rvt-component-calendar-tile-text);text-align:center}
.rvt-calendar-tile__month,.rvt-calendar-tile__year{display:block;align-self:stretch;margin:0;
  font:var(--rvt-font-tag-lg-caps);letter-spacing:var(--rvt-font-tracking-xl);text-transform:uppercase}
.rvt-calendar-tile__day{display:block;margin:0;white-space:nowrap;
  font:var(--rvt-font-component-number-strong);font-stretch:150%;letter-spacing:var(--rvt-font-tracking-none);
  text-box:trim-both cap alphabetic}
/* ---------- rvt-alert (Alert page, Developer spec checklist) ----------
   Themed like every other component: its tokens follow the page theme (Light, Dark, Crimson), e.g. Info on Dark = background/info-subtle black,
   text/info white, border/info light blue. Badges keep their status fill in every theme.
   Default/Buttons: spacing/24 padding (spacing/16 on mobile), spacing/16 gap; background/{status}-subtle.
   The 1px border/{status} is drawn inside the box (inset box-shadow), so it adds nothing to the width or height: 212px / 268px tall (Inline 32px), like the design.
   Title row: 28px status badge (16px glyph) + heading/md/strong text/{status}, spacing/8 apart; the title sits 2px down so its line centers on the badge.
   Description, list and actions indent 36px (28px badge + spacing/8), flush with the title text on Desktop and Mobile.
   Inline: spacing/4 x spacing/8 padding (spacing/4 all sides on mobile), 24px badge with a 12px glyph in a 24 x 24 slot, spacing/8 to the text, body/xs/regular 2px down to center on the badge.
   Close button on Info and Success only: 16px (12px Inline), 16px (4px Inline) from the top and right outer edges. */
.rvt-alert-stack{display:flex;flex-direction:column;gap:var(--rvt-spacing-24)}
.rvt-alert{--alert-bg:var(--rvt-background-info-subtle);--alert-border:var(--rvt-border-info);--alert-badge:var(--rvt-background-info-strong);--alert-badge-border:transparent;--alert-glyph:var(--rvt-color-base-ultra-light);--alert-title:var(--rvt-text-info);
  position:relative;box-sizing:border-box;display:flex;flex-direction:column;gap:var(--rvt-spacing-16);width:100%;margin:0;padding:var(--rvt-spacing-24);
  background:var(--alert-bg);border:0;box-shadow:inset 0 0 0 1px var(--alert-border);color:var(--rvt-text-default)}
.rvt-alert--success{--alert-bg:var(--rvt-background-success-subtle);--alert-border:var(--rvt-border-success);--alert-badge:var(--rvt-background-success-strong);--alert-badge-border:var(--rvt-border-success-fixed);--alert-title:var(--rvt-text-success)}
.rvt-alert--warning{--alert-bg:var(--rvt-background-warning-subtle);--alert-border:var(--rvt-border-warning);--alert-badge:var(--rvt-background-warning-strong);--alert-glyph:var(--rvt-color-base-main);--alert-title:var(--rvt-text-warning)}
.rvt-alert--danger{--alert-bg:var(--rvt-background-danger-subtle);--alert-border:var(--rvt-border-danger);--alert-badge:var(--rvt-background-danger-strong);--alert-title:var(--rvt-text-danger)}
.rvt-alert--default{--alert-bg:var(--rvt-background-brand-subtle);--alert-border:var(--rvt-border-brand);--alert-badge:var(--rvt-background-brand-strong);--alert-title:var(--rvt-text-brand)}
.rvt-alert[hidden]{display:none}
/* Page notes (every > [!type] callout, and the home page note) use this component and follow the page theme like everything else; undo the prose list and paragraph styles inside it. */
.rvt-alert--note{margin:0 0 var(--rvt-spacing-24)}
.prose .rvt-alert--note p{margin:0}
.prose .rvt-alert--note .rvt-alert__list{display:flex;margin:0;padding:0 0 0 calc(28px + var(--rvt-spacing-8));gap:var(--rvt-spacing-8)}
.prose .rvt-alert--note .rvt-alert__list>li{padding-left:0}
.prose .rvt-alert--note .rvt-alert__list>li::before{position:static;width:6px;height:6px;margin-top:9px;background:var(--rvt-icon-default)}
.prose .rvt-alert--note .rvt-alert__desc,.prose .rvt-alert--note .rvt-alert__list>li{color:var(--rvt-text-default);
  font:var(--rvt-font-body-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-alert:focus{outline:none}
.rvt-alert__block{display:flex;flex-direction:column;gap:var(--rvt-spacing-8);min-width:0}
.rvt-alert__head{display:flex;align-items:flex-start;gap:var(--rvt-spacing-8)}
.rvt-alert__badge{box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--rvt-border-radius-full);
  background:var(--alert-badge);border:1px solid var(--alert-badge-border);color:var(--alert-glyph)}
.rvt-alert__badge svg{display:block;width:16px;height:16px;fill:currentColor}
.rvt-alert__title{flex:1 1 auto;min-width:0;margin:0;padding-top:2px;color:var(--alert-title);overflow-wrap:anywhere;
  font:var(--rvt-font-heading-md-strong);font-stretch:var(--rvt-font-width-semi-expanded);font-variation-settings:var(--rvt-font-axes-heading);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-alert__desc{margin:0;padding-left:calc(28px + var(--rvt-spacing-8));max-width:calc(850px + calc(28px + var(--rvt-spacing-8)));color:var(--rvt-text-default);
  font:var(--rvt-font-body-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-alert__list{display:flex;flex-direction:column;gap:var(--rvt-spacing-8);margin:0;padding:0 0 0 calc(28px + var(--rvt-spacing-8));list-style:none}
.rvt-alert__list li{display:flex;align-items:flex-start;gap:var(--rvt-spacing-8);max-width:calc(6px + var(--rvt-spacing-8) + 920px);color:var(--rvt-text-default);
  font:var(--rvt-font-body-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
/* Bullet: 6px icon/default square, centered in a 24px-tall slot so it sits on the first line. */
.rvt-alert__list li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;background:var(--rvt-icon-default)}
.rvt-alert__actions{display:flex;flex-wrap:wrap;gap:var(--rvt-spacing-16);padding:var(--rvt-spacing-8) 0 0 calc(28px + var(--rvt-spacing-8))}
/* rvt-button, Form, Large: component/button/height-lg (40px, same on Mobile), spacing/16 sides, action/lg/strong. Primary = Style Strong, Secondary = Style Normal. */
.rvt-alert__btn{box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--rvt-spacing-8);height:var(--rvt-component-button-height-lg);margin:0;padding:0 var(--rvt-spacing-16);
  border:1px solid var(--rvt-component-button-form-border);border-radius:0;cursor:pointer;-webkit-appearance:none;appearance:none;white-space:nowrap;
  font:var(--rvt-font-action-lg-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);
  transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
.rvt-alert__btn--primary{background:var(--rvt-component-button-form-background);border-color:var(--rvt-component-button-form-background);color:var(--rvt-text-on-brand-alt)}
.rvt-alert__btn--primary:hover{background:var(--rvt-component-button-form-background-hover);border-color:var(--rvt-component-button-form-background-hover)}
.rvt-alert__btn--secondary{background:transparent;color:var(--rvt-component-button-form-text)}
.rvt-alert__btn--secondary:hover{border-color:var(--rvt-component-button-form-border-hover);color:var(--rvt-component-button-form-text-hover)}
.rvt-alert__btn:focus-visible,.rvt-alert__close:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:2px}
/* Close: 16px from the top and right outer edges (no token), icon/strong; hover component/button/form-text-hover, same as buttons. The ::before widens the click target without moving the icon. */
.rvt-alert__close{position:absolute;top:16px;right:16px;display:block;width:16px;height:16px;margin:0;padding:0;border:0;border-radius:0;background:transparent;color:var(--rvt-icon-strong);cursor:pointer;-webkit-appearance:none;appearance:none}
.rvt-alert__close::before{content:"";position:absolute;inset:-8px}
.rvt-alert__close svg{display:block;width:100%;height:100%;fill:currentColor}
.rvt-alert__close:hover{color:var(--rvt-component-button-form-text-hover)}
/* Inline */
.rvt-alert--inline{flex-direction:row;align-items:flex-start;gap:var(--rvt-spacing-8);padding:var(--rvt-spacing-4)}
.rvt-alert__slot{flex:none;display:flex;align-items:center;justify-content:center;width:24px;height:24px}
.rvt-alert--inline .rvt-alert__badge{width:24px;height:24px}
.rvt-alert--inline .rvt-alert__badge svg{width:12px;height:12px}
.rvt-alert__message{margin:0;padding-top:2px;max-width:500px;min-width:0;color:var(--rvt-text-default);
  font:var(--rvt-font-body-xs-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-alert--inline .rvt-alert__close{top:4px;right:4px;width:12px;height:12px}
.rvt-alert--inline .rvt-alert__close::before{inset:-6px}
@media (max-width:767px){
  .rvt-alert{padding:var(--rvt-spacing-16)}
  .rvt-alert__desc{max-width:none}
  /* Mobile buttons stack, spacing/16 apart, each hugging its label. */
  .rvt-alert__actions{flex-direction:column;align-items:flex-start}
  .rvt-alert--inline .rvt-alert__message{flex:1 1 auto;max-width:none}
  .rvt-alert--inline.has-close .rvt-alert__message{max-width:280px}
}
/* ---------- Example option: radio group beside "Select type" (e.g. Billboard "Links: One button / Multiple links") ----------
   rvt-radio, Type=Inline: options side by side, spacing/24 apart; option text action/lg/regular text/strong, spacing/8 from the circle.
   Circle 20px: unchecked 1px border/strong ring, no fill; checked 1px border/accent ring with a background/brand dot.
   Focus: 2px border/accent-strong ring around the circle (24px). The label sits spacing/8 above the options, as on the other two controls; the group
   reserves the same 40px as the tabs and dropdown beside it so the three labels line up, with the options at the top of that space. */
.rvt-radio-group{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:var(--rvt-spacing-24);row-gap:var(--rvt-spacing-8);min-height:var(--rvt-component-input-height-md)}
.rvt-radio{display:inline-flex;align-items:center;gap:var(--rvt-spacing-8);cursor:pointer;color:var(--rvt-text-strong);
  font:var(--rvt-font-action-lg-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-radio__input{box-sizing:border-box;flex:none;position:relative;width:20px;height:20px;margin:0;border:1px solid var(--rvt-border-strong);border-radius:var(--rvt-border-radius-full);
  background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none}
.rvt-radio__input:checked{border-color:var(--rvt-border-accent)}
.rvt-radio__input:checked::after{content:"";position:absolute;inset:4px;border-radius:var(--rvt-border-radius-full);background:var(--rvt-background-brand)}
.rvt-radio__input:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:1px}

/* ---------- rvt-billboard (Billboard page, Developer spec checklist) ----------
   Side by side (the billboard is 800px wide or more, like the Rivet build's 50rem container query): two columns on background/strong, content bottom-aligned.
     Image column 66% of the billboard (924px of the 1400px Desktop frame), image 1:1 with spacing/24 top, bottom and outer side; the content column takes the rest.
     Content: spacing/40 from the image, spacing/64 on its outer side, spacing/48 at the bottom (372px of text at 1400px). Between 800px and 1100px wide the gaps drop to spacing/32, and the content column never goes under 280px (the image gives way), so the text keeps room.
   Reversed: the image column moves to the right.
   Stacked (under 800px wide): image above content, full width at 3:2, spacing/20 top and sides; text spacing/32 all sides; links spacing/32 sides and below, so everything sits inside one even 24px frame. Reversed has no effect.
   Stacked always uses the Mobile token values (see the container block below), so the type and spacing scale down with the component, not just with the screen.
   Eyebrow tag/sm/caps text/brand, spacing/8 below, 2px in. Title display/xs/strong text/brand (26/32, 20/24 in Mobile mode, like the feature card). Description body/sm/regular text/default, spacing/20 above.
   Single link: rvt-button Link, Normal, Extra-large, spacing/32 above. Multiple links: rvt-list-hub Compact, full width, spacing/32 above. */
.rvt-billboard-wrap{container-type:inline-size}
.rvt-billboard{display:grid;grid-template-columns:minmax(0,66%) minmax(280px,1fr);column-gap:var(--rvt-spacing-40);align-items:end;background:var(--rvt-background-strong)}
.rvt-billboard__media{padding:var(--rvt-spacing-24) 0 var(--rvt-spacing-24) var(--rvt-spacing-24)}
/* Auto crop: the photo is never resized by hand. The slot sets the shape (1:1 beside the text, 3:2 above it) and object-fit: cover fills it,
   trimming the long sides. The crop is anchored at --rvt-image-focus, which defaults to the centre of the top third (50% 25%), where faces usually are,
   so one landscape photo works in both shapes. A page can move the focal point per image with style="--rvt-image-focus: 30% 50%" when a photo needs it. */
.rvt-billboard__media img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;object-position:var(--rvt-image-focus,50% 25%)}
.rvt-billboard__content{min-width:0;padding:0 var(--rvt-spacing-64) var(--rvt-spacing-48) 0;overflow-wrap:break-word}
.rvt-billboard--reversed{grid-template-columns:minmax(280px,1fr) minmax(0,66%)}
.rvt-billboard--reversed .rvt-billboard__media{order:2;padding:var(--rvt-spacing-24) var(--rvt-spacing-24) var(--rvt-spacing-24) 0}
.rvt-billboard--reversed .rvt-billboard__content{padding:0 0 var(--rvt-spacing-48) var(--rvt-spacing-64)}
.rvt-billboard__eyebrow{margin:0;padding:0 0 var(--rvt-spacing-8) 2px;color:var(--rvt-text-brand);
  font:var(--rvt-font-tag-sm-caps);letter-spacing:var(--rvt-font-tracking-xl);text-transform:uppercase}
.rvt-billboard__title{margin:0;color:var(--rvt-text-brand);overflow-wrap:break-word;
  font:var(--rvt-font-display-xs-strong);font-stretch:var(--rvt-font-width-normal);font-variation-settings:var(--rvt-font-axes-heading);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-billboard__desc{margin:0;padding-top:var(--rvt-spacing-20);color:var(--rvt-text-default);
  font:var(--rvt-font-body-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-billboard__actions{padding-top:var(--rvt-spacing-32)}
/* rvt-button, Link, Normal, Extra-large: component/button/height-xl, spacing/16 sides, spacing/8 to the 16px arrow; 1px border/accent drawn inside.
   Hover: border/accent-strong, text/brand-strong, icon/accent-strong (150ms). Focus: 2px border/accent-strong, 2px offset. */
.rvt-billboard__button{box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--rvt-spacing-8);height:var(--rvt-component-button-height-xl);padding:0 var(--rvt-spacing-16);
  box-shadow:inset 0 0 0 1px var(--rvt-border-accent);color:var(--rvt-text-accent);text-decoration:none;white-space:nowrap;
  font:var(--rvt-font-action-lg-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);
  transition:box-shadow .15s ease-out,color .15s ease-out}
.rvt-billboard__button svg{display:block;width:16px;height:16px;fill:var(--rvt-icon-accent);transition:fill .15s ease-out}
.rvt-billboard__button:hover{box-shadow:inset 0 0 0 1px var(--rvt-border-accent-strong);color:var(--rvt-text-brand-strong)}
.rvt-billboard__button:hover svg{fill:var(--rvt-icon-accent-strong)}
.rvt-billboard__button:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:2px}
/* rvt-list-hub, Compact, title only: one 1px border/default rule above the first item and between items (never doubled); the last item has no rule below it.
   Item spacing/12 top and bottom, the last item spacing/12 top only; rvt-arrow-right-12 (icon/strong) in a 16 x 24 slot, spacing/4 to the title; title action/lg/strong text/strong.
   Hover: title text/accent + underline, arrow icon/accent (150ms). */
.rvt-billboard__links{margin:0;padding:0;list-style:none;border-top:1px solid var(--rvt-border-default)}
.rvt-billboard__links li{border-bottom:1px solid var(--rvt-border-default)}
.rvt-billboard__links li:last-child{border-bottom:0}
.rvt-billboard__links li:last-child .rvt-billboard__link{padding-bottom:0}
.rvt-billboard__link{display:flex;align-items:flex-start;gap:var(--rvt-spacing-4);padding:var(--rvt-spacing-12) 0;color:var(--rvt-text-strong);text-decoration:none;
  font:var(--rvt-font-action-lg-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);
  text-underline-offset:3px;transition:color .15s ease-out}
.rvt-billboard__arrow{flex:none;display:flex;align-items:center;justify-content:center;width:16px;height:24px}
.rvt-billboard__arrow svg{display:block;width:12px;height:12px;fill:var(--rvt-icon-strong);transition:fill .15s ease-out}
.rvt-billboard__link-text{flex:1 1 auto;min-width:0}
.rvt-billboard__link:hover{color:var(--rvt-text-accent)}
.rvt-billboard__link:hover .rvt-billboard__link-text{text-decoration:underline}
.rvt-billboard__link:hover svg{fill:var(--rvt-icon-accent)}
.rvt-billboard__link:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:2px}
@container (max-width:1099px){
  .rvt-billboard,.rvt-billboard--reversed{column-gap:var(--rvt-spacing-32)}
  .rvt-billboard__content{padding:0 var(--rvt-spacing-32) var(--rvt-spacing-32) 0}
  .rvt-billboard--reversed .rvt-billboard__content{padding:0 0 var(--rvt-spacing-32) var(--rvt-spacing-32)}
}
@container (max-width:799px){
  /* Stacked = the component's Mobile mode, whatever the screen size: the tokens that have a Mobile value in Figma (spacing/32, /64, type size 26 and the 24-32 line height)
     take that value here, the same values generated/rivet-tokens.css gives them below 768px. So a billboard squeezed into a narrow column on a wide screen still gets Mobile type and spacing. */
  .rvt-billboard,.rvt-billboard--reversed{display:flex;flex-direction:column;align-items:stretch;
    --rvt-spacing-32:24px;--rvt-spacing-64:48px;--rvt-type-size-26:20px;--rvt-type-line-height-24-32:24px}
  .rvt-billboard__media,.rvt-billboard--reversed .rvt-billboard__media{order:0;padding:var(--rvt-spacing-20) var(--rvt-spacing-20) 0}
  /* Stacked image: full width at 3:2, the shape the feature card and the Mobile feature hero use, so a tablet-width column gets a banner instead of a giant square. */
  .rvt-billboard__media img{aspect-ratio:3/2}
  .rvt-billboard__content,.rvt-billboard--reversed .rvt-billboard__content{padding:0}
  .rvt-billboard__text{padding:var(--rvt-spacing-32)}
  .rvt-billboard__title{font-size:var(--rvt-type-size-26);line-height:var(--rvt-type-line-height-24-32)}
  .rvt-billboard__actions{padding:0 var(--rvt-spacing-32) var(--rvt-spacing-32)}
}
@media (prefers-reduced-motion:reduce){.rvt-billboard__button,.rvt-billboard__button svg,.rvt-billboard__link,.rvt-billboard__arrow svg{transition:none}}
/* ---------- rvt-breadcrumbs (Breadcrumbs page example, Developer spec checklist) ----------
   Trail: one row that wraps, spacing/4 between items and between wrapped lines. Every item is 20px tall.
   Separator: 12px rvt-chevron-right-12 in icon/brand, spacing/4 after every item except the current page; it never changes on hover.
   Home: 12px rvt-home-12 in icon/link-subtle, spacing/4 above and below; hover icon/accent-strong plus a 1px border/accent-strong line under it, drawn inside so the item stays 20px.
   Earlier pages: action sm regular (14/20, weight 350, width 110%) text/link-subtle, no underline; hover text/brand-strong, underlined.
   Current page: action sm strong (14/20, weight 600, width 110%) text/strong, not a link (aria-current="page").
   Focus: 2px border/accent-strong, 2px offset (same as the accordion). Colour changes ease over 150ms. */
.rvt-breadcrumbs__list{display:flex;flex-wrap:wrap;align-items:center;gap:var(--rvt-spacing-4);margin:0;padding:0;list-style:none}
.rvt-breadcrumbs__item{display:flex;align-items:center;gap:var(--rvt-spacing-4);height:var(--rvt-type-line-height-20)}
.rvt-breadcrumbs__sep{display:block;flex:none;width:12px;height:12px;fill:var(--rvt-icon-brand)}
.rvt-breadcrumbs__home{display:flex;align-items:center;padding-block:var(--rvt-spacing-4);color:var(--rvt-icon-link-subtle);transition:color 150ms ease-out,box-shadow 150ms ease-out}
.rvt-breadcrumbs__home svg{display:block;width:12px;height:12px;fill:currentColor}
.rvt-breadcrumbs__home:hover{color:var(--rvt-icon-accent-strong);box-shadow:inset 0 -1px 0 var(--rvt-border-accent-strong)}
.rvt-breadcrumbs__link{font:var(--rvt-font-action-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);color:var(--rvt-text-link-subtle);text-decoration:none;white-space:nowrap;transition:color 150ms ease-out}
.rvt-breadcrumbs__link:hover{color:var(--rvt-text-brand-strong);text-decoration-line:underline;text-decoration-thickness:from-font;text-underline-position:from-font}
.rvt-breadcrumbs__current{font:var(--rvt-font-action-sm-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);color:var(--rvt-text-strong);white-space:nowrap}
.rvt-breadcrumbs__home:focus-visible,.rvt-breadcrumbs__link:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.rvt-breadcrumbs__home,.rvt-breadcrumbs__link{transition:none}}

/* ---------- rvt-callout (Callout page example, Developer spec checklist) ----------
   One box: picture (sticker or avatar) plus text column (eyebrow, title, description, up to two links).
   Tone Strong: background/strong, no border; description text/brand. Tone Normal: background/default with a 1px border/default drawn inside (so it doesn't add to the size); description text/default.
   Desktop: spacing/80 padding all sides. Left: picture beside the text, items top-aligned and centered as a group, text column max 850px with spacing/8 above.
     Gap spacing/32. Top: picture above the text, gap spacing/24.
   Sticker and avatar: the same size, 80px on Desktop and 64px on Mobile. Sticker: Crimson, with container (color/brand-light circle, color/brand-main art, white fill); the same in every theme.
   Avatar: rvt-avatar (photo).
   Text block matches the billboard and feature card: eyebrow tag/sm/caps text/brand, spacing/8 below, 2px in. Title display/xs/strong text/brand (26/32, 20/24 on Mobile).
   Description body/sm/regular (16/24), spacing/20 above.
   Links: rvt-button Link, Normal, Extra-large, side by side spacing/16 apart, spacing/32 above. */
.rvt-callout-wrap{container-type:inline-size}
.rvt-callout{box-sizing:border-box;display:flex;align-items:flex-start;justify-content:center;gap:var(--callout-gap);padding:var(--rvt-spacing-80);
  --callout-gap:var(--rvt-spacing-32);--callout-desc:var(--rvt-text-default);--callout-media:80px;
  background:var(--rvt-background-default);box-shadow:inset 0 0 0 1px var(--rvt-border-default)}
.rvt-callout--strong{--callout-desc:var(--rvt-text-brand);background:var(--rvt-background-strong);box-shadow:none}
.rvt-callout--top{flex-direction:column;justify-content:flex-start;--callout-gap:var(--rvt-spacing-24)}
.rvt-callout__media{flex:none;display:flex}
.rvt-callout .rvt-avatar{--avatar-size:var(--callout-media)}
.rvt-callout__sticker{display:block;width:var(--callout-media);height:var(--callout-media);border-radius:var(--rvt-border-radius-full);background:var(--rvt-color-brand-light);color:var(--rvt-color-brand-main)}
.rvt-callout__sticker svg{display:block;width:100%;height:100%}
.rvt-callout__sticker .fill{fill:var(--rvt-color-base-ultra-light)}
.rvt-callout__sticker .art{fill:currentColor}
.rvt-callout__body{flex:1 1 0;min-width:0;max-width:850px;padding-top:var(--rvt-spacing-8);overflow-wrap:break-word}
.rvt-callout--top .rvt-callout__body{flex:none;width:100%;padding-top:0}
.rvt-callout__eyebrow{margin:0;padding:0 0 var(--rvt-spacing-8) 2px;color:var(--rvt-text-brand);
  font:var(--rvt-font-tag-sm-caps);letter-spacing:var(--rvt-font-tracking-xl);text-transform:uppercase}
.rvt-callout__title{margin:0;color:var(--rvt-text-brand);
  font:var(--rvt-font-display-xs-strong);font-stretch:var(--rvt-font-width-normal);font-variation-settings:var(--rvt-font-axes-heading);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-callout__desc{margin:0;padding-top:var(--rvt-spacing-20);color:var(--callout-desc);
  font:var(--rvt-font-body-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-callout__actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--rvt-spacing-16);padding-top:var(--rvt-spacing-32)}
/* rvt-button, Link, Normal, Extra-large (same as the billboard's single link): component/button/height-xl, spacing/16 sides, spacing/8 to the 16px arrow; 1px border/accent drawn inside.
   Hover: border/accent-strong, text/brand-strong, icon/accent-strong (150ms). Focus: 2px border/accent-strong, 2px offset. */
.rvt-callout__button{box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--rvt-spacing-8);height:var(--rvt-component-button-height-xl);padding:0 var(--rvt-spacing-16);
  box-shadow:inset 0 0 0 1px var(--rvt-border-accent);color:var(--rvt-text-accent);text-decoration:none;white-space:nowrap;
  font:var(--rvt-font-action-lg-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none);
  transition:box-shadow .15s ease-out,color .15s ease-out}
.rvt-callout__button svg{display:block;flex:none;width:16px;height:16px;fill:var(--rvt-icon-accent);transition:fill .15s ease-out}
.rvt-callout__button:hover{box-shadow:inset 0 0 0 1px var(--rvt-border-accent-strong);color:var(--rvt-text-brand-strong)}
.rvt-callout__button:hover svg{fill:var(--rvt-icon-accent-strong)}
.rvt-callout__button:focus-visible{outline:2px solid var(--rvt-border-accent-strong);outline-offset:2px}
@container (max-width:799px){
  /* Stacked = the component's Mobile mode, whatever the screen size (like the billboard): the tokens with a Mobile value take it here,
     the same values generated/rivet-tokens.css gives them below 768px. Everything stacks, whatever the orientation.
     Padding spacing/32 (24px) top and sides, spacing/40 (32px) bottom. Gap spacing/20.
     Sticker and avatar 64px. Title 20/24. Description unchanged (16/24, spacing/20 above). Links stacked, each hugging its label, spacing/16 apart. */
  .rvt-callout{--rvt-spacing-32:24px;--rvt-spacing-40:32px;--rvt-type-size-26:20px;--rvt-type-line-height-24-32:24px;
    flex-direction:column;align-items:stretch;justify-content:flex-start;--callout-gap:var(--rvt-spacing-20);
    padding:var(--rvt-spacing-32) var(--rvt-spacing-32) var(--rvt-spacing-40);--callout-media:64px}
  .rvt-callout--top{--callout-gap:var(--rvt-spacing-20)}
  .rvt-callout__media{align-self:flex-start}
  .rvt-callout__body,.rvt-callout--top .rvt-callout__body{flex:none;width:100%;padding-top:0}
  .rvt-callout__actions{flex-direction:column;align-items:flex-start}
  .rvt-callout__title{font-size:var(--rvt-type-size-26);line-height:var(--rvt-type-line-height-24-32)}
}
@media (prefers-reduced-motion:reduce){.rvt-callout__button,.rvt-callout__button svg{transition:none}}

@media (prefers-reduced-motion:reduce){
  .rvt-alert__btn,.rvt-accordion__panel,.rvt-accordion__panel.is-open,.rvt-accordion__item,.rvt-accordion__icon svg path,.rvt-tabs__tab,.rvt-tabs--segmented.is-animated :is(.rvt-tabs__indicator,.rvt-tabs__indicator-edge,.rvt-tabs__indicator-fill){transition:none}
}

/* ---------- rvt-card (Card page example, Developer spec checklist) ----------
   Types: Orientation (Vertical 440px, Horizontal 1200px Desktop frames) x Layout (Image, Sticker, Plain). Style radio: Outlined (1px border/default, drawn inside)
   or Raised (shadow/sm, no border). Each type shows both sizes, Default then Compact, labelled underneath: side by side for Vertical, stacked for Horizontal.
   Default: spacing/32 padding; Image 3:2 spacing/32 below (Horizontal 240 x 160, spacing/32 to text); Sticker 80px spacing/24 below / to text;
     title action/xl/strong with the 16px arrow; description and list body/sm/regular, spacing/16 above; footer spacing/24 above.
   Compact: spacing/16 padding; Image spacing/24 below; Sticker 48px spacing/8 below / to text; title action/lg/strong with the 12px arrow;
     description and list body/xs/regular, spacing/8 above; footer spacing/16 above.
   The whole card is the link (the title link's ::after covers the card). Hover: title text/accent + underline, arrow icon/accent; the border stays.
   Focus: 2px border/accent-strong ring 1px outside the card. Mobile (under 768px): spacing/24 padding, Image spacing/24 below, Sticker 64px spacing/16 below
   (Compact unchanged), and Horizontal cards stack like Vertical ones. Sticker colors are the Rivet sticker colors, the same in every theme. */
.rvt-card-set{display:flex;align-items:flex-start;gap:var(--rvt-spacing-24) var(--rvt-spacing-32);margin:0;padding:0;list-style:none}
.rvt-card-set--vertical{flex-wrap:wrap}
.rvt-card-set--horizontal{flex-direction:column;align-items:stretch;gap:var(--rvt-spacing-24)}
.rvt-card-set__item{display:flex;flex-direction:column;gap:var(--rvt-spacing-8);min-width:0}
.rvt-card-set--vertical .rvt-card-set__item{flex:1 1 300px;max-width:440px} /* Figma Breakpoint=Desktop, Orientation=Vertical frame width */
.rvt-card-set__label{contain:inline-size;color:var(--rvt-text-default);
  font:var(--rvt-font-tag-sm-regular);font-stretch:var(--rvt-font-width-normal);letter-spacing:var(--rvt-font-tracking-lg)}
.rvt-card{--card-pad:var(--rvt-spacing-32);--card-media-gap:var(--rvt-spacing-32);--card-sticker:80px;--card-sticker-gap:var(--rvt-spacing-24);
  --card-text-gap:var(--rvt-spacing-16);--card-foot-gap:var(--rvt-spacing-24);
  box-sizing:border-box;position:relative;display:flex;flex-direction:column;width:100%;padding:var(--card-pad);
  background:var(--rvt-background-raised);box-shadow:inset 0 0 0 1px var(--rvt-border-default);border-radius:0}
.rvt-card--raised{box-shadow:var(--rvt-shadow-sm)}
.rvt-card--compact{--card-pad:var(--rvt-spacing-16);--card-media-gap:var(--rvt-spacing-24);--card-sticker:48px;--card-sticker-gap:var(--rvt-spacing-8);
  --card-text-gap:var(--rvt-spacing-8);--card-foot-gap:var(--rvt-spacing-16)}
.rvt-card:has(.rvt-card__link:focus-visible){outline:2px solid var(--rvt-border-accent-strong);outline-offset:1px}
.rvt-card__media{flex:none;margin:0 0 var(--card-media-gap)}
.rvt-card__image{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.rvt-card--sticker .rvt-card__media{margin-bottom:var(--card-sticker-gap)}
.rvt-card__sticker{display:block;width:var(--card-sticker);height:var(--card-sticker);border-radius:var(--rvt-border-radius-full);background:var(--rvt-color-brand-light);color:var(--rvt-color-brand-main)}
.rvt-card__sticker svg{display:block;width:100%;height:100%}
.rvt-card__sticker .fill{fill:var(--rvt-color-base-ultra-light)}
.rvt-card__sticker .art{fill:currentColor}
.rvt-card__body{display:flex;flex-direction:column;min-width:0}
.rvt-card__featured{align-self:flex-start;margin:0 0 var(--rvt-spacing-12)}
.rvt-card__eyebrow{margin:0;padding:0 0 var(--rvt-spacing-4) 2px;color:var(--rvt-text-brand);
  font:var(--rvt-font-tag-sm-regular);font-stretch:var(--rvt-font-width-normal);letter-spacing:var(--rvt-font-tracking-lg)}
.rvt-card__head{display:flex;align-items:flex-start;gap:var(--rvt-spacing-16)}
.rvt-card__title{flex:1 1 auto;min-width:0;margin:0;color:var(--rvt-text-strong);
  font:var(--rvt-font-action-xl-strong);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}
.rvt-card__link{color:inherit;text-decoration:underline;text-decoration-color:transparent;text-underline-position:from-font;transition:color .15s ease-out,text-decoration-color .15s ease-out}
.rvt-card__link::after{content:"";position:absolute;inset:0;z-index:1}
.rvt-card__link:focus-visible{outline:none}
.rvt-card__arrow{flex:none;display:flex;padding-top:6px;color:var(--rvt-icon-strong);transition:color .15s ease-out}
.rvt-card__arrow svg{display:block;width:16px;height:16px;fill:currentColor}
.rvt-card:hover .rvt-card__link{color:var(--rvt-text-accent);text-decoration-color:currentColor}
.rvt-card:hover .rvt-card__arrow{color:var(--rvt-icon-accent)}
.rvt-card__desc{margin:0;padding-top:var(--card-text-gap);color:var(--rvt-text-default);
  font:var(--rvt-font-body-sm-regular);font-stretch:var(--rvt-font-width-semi-expanded);letter-spacing:var(--rvt-font-tracking-none)}

    const draw = () => {
      const q = input.value.trim().toLowerCase();

      title.textContent = q ? `${rows.length} of ${list.length} components` : `${list.length} component${list.length === 1 ? '' : 's'}`;

      const groupOf = n => { const m = n.match(/^(.+?)(?:\s+[–—-]\s+|-)/); return m ? m[1].trim().toLowerCase() : null; };
      // The base item (e.g. Card) joins its group too: its own name is the key the others share
      const groupKey = n => groupOf(n) || n.trim().toLowerCase();

  /* ---------- Markdown helpers ---------- */
  function preprocess(md) {
    md = md.replace(/^﻿/, '').replace(/^---\n[\s\S]*?\n---\n/, '');
    md = md.replace(/^#\s+.*\n+/, '');
    md = md.replace(/%%[\s\S]*?%%/g, '');
    md = md.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
    md = md.replace(/\{\{icon:([a-z-]+)\}\}/g, (m, n) => { const k = n.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); return P[k] ? `<svg class="prose-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="${P[k]}"/></svg>` : m; });
    md = md.replace(/!\[\[([^\]]+)\]\]/g, '');
    md = md.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, target, alias) => {
      const t = target.trim();
      const hit = list.find(c => c.name.toLowerCase() === t.toLowerCase() || c.slug === t.toLowerCase());
      const text = alias || t;
      return hit ? `[${text}](#${hit.slug})` : text;
    });
    return md;
  }

  function enhance(root) {
    // Tables: name each from its preceding heading, mark column + row headers, make the scroll box keyboard-reachable
    root.querySelectorAll('table').forEach((t, i) => {
      let h = t.previousElementSibling;
      while (h && !/^H[2-4]$/.test(h.tagName)) h = h.previousElementSibling;
      const w = document.createElement('div'); w.className = 'table-wrap';
      w.setAttribute('role', 'region'); w.tabIndex = 0;
      if (h) { if (!h.id) h.id = 'tbl-h-' + i; t.setAttribute('aria-labelledby', h.id); w.setAttribute('aria-labelledby', h.id); }
      else { w.setAttribute('aria-label', 'Table ' + (i + 1)); }
      t.querySelectorAll('thead th').forEach(th => th.setAttribute('scope', 'col'));
      t.querySelectorAll('tbody tr').forEach(tr => {
        const td = tr.firstElementChild;
        if (td && td.tagName === 'TD') { const th = document.createElement('th'); th.setAttribute('scope', 'row'); th.innerHTML = td.innerHTML; td.replaceWith(th); }
      });
      t.replaceWith(w); w.appendChild(t);
    });
    root.querySelectorAll('tbody code').forEach(c => { if (c.children.length === 0 && c.textContent.includes('/')) c.innerHTML = esc(c.textContent).replace(/\//g, '/<wbr>'); });
    root.querySelectorAll('code').forEach(c => {
      if (c.closest('pre')) return;
      const m = c.textContent.trim().match(/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (m) { const s = document.createElement('span'); s.className = 'sw'; s.style.background = m[0]; c.prepend(s); }
    });
    // "What it is" (or "Overview"): the list right after the first paragraph -> rvt-list-hub Compact, title only (Check), examples of where to use it
    root.querySelectorAll('h2').forEach(h => {
      if (!['what it is', 'overview'].includes(h.textContent.trim().toLowerCase())) return;
      const p = h.nextElementSibling, ul = p && p.nextElementSibling;
      if (!p || p.tagName !== 'P' || !ul || ul.tagName !== 'UL') return;
      const kind = 'check';
      ul.className = 'rvt-list-hub rvt-list-hub--check rvt-list-hub--examples';
      ul.setAttribute('aria-label', 'Where to use it');
      [...ul.children].forEach(li => {
        li.innerHTML = `<span class="rvt-list-hub__marker" aria-hidden="true"><svg viewBox="0 0 12 12" focusable="false"><path d="${P12[kind === 'check' ? 'check' : 'close']}"/></svg></span><span class="rvt-list-hub__title">${li.innerHTML}</span>`;
      });
    });
    // Obsidian callouts -> rvt-alert
    root.querySelectorAll('blockquote').forEach(bq => {
      const first = bq.querySelector('p');
      if (!first) return;
      const m = first.innerHTML.match(/^\[!(\w+)(?:\|(\w+))?\][+-]?\s*([^\n<]*)(?:\n|<br>)?/i);
      if (!m) return;
      const raw = m[1].toLowerCase();
      const kind = KIND[raw] || 'info';
      const title = m[3].trim() || raw.charAt(0).toUpperCase() + raw.slice(1);
      first.innerHTML = first.innerHTML.slice(m[0].length).trim();
      if (!first.innerHTML) first.remove();
      const box = document.createElement('div');
      /* Every callout renders with the real rvt-alert component (same markup and CSS as the Alert example) and follows the page theme. */
      box.className = `rvt-alert rvt-alert--${kind} rvt-alert--note`; box.setAttribute('role', 'note');
      box.innerHTML = `<div class="rvt-alert__block"><div class="rvt-alert__head"><span class="rvt-alert__badge" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="${P[ALERT_ICON[kind]]}"/></svg></span><p class="rvt-alert__title">${esc(title)}</p></div></div>`;
      const block = box.firstElementChild;
      [...bq.children].forEach((el, i) => {
        if (el.tagName === 'UL') { el.className = 'rvt-alert__list'; box.appendChild(el); }
        else { el.classList.add('rvt-alert__desc'); (i === 0 && el.tagName === 'P' ? block : box).appendChild(el); }
      });
      bq.replaceWith(box);
    });
    // Do / Don't
    const isDo = t => /^do['’]?s?$/i.test(t.trim());
    const isDont = t => /^don['’]?t'?s?$/i.test(t.trim()) || /^do not$/i.test(t.trim());
    let group = null;
    [...root.querySelectorAll('h3, h4')].forEach(h => {
      const txt = h.textContent;
      if (!isDo(txt) && !isDont(txt)) { group = null; return; }
      const card = document.createElement('div');
      card.className = 'dd-card' + (isDont(txt) ? ' dont' : '');
      const h3 = document.createElement('h3');
      h3.innerHTML = `<span class="alert-ic">${icon(isDont(txt) ? 'close' : 'check')}</span><span>${esc(txt.trim())}</span>`;
      card.appendChild(h3);
      let n = h.nextElementSibling;
      while (n && !/^H[1-4]$/.test(n.tagName) && !n.classList.contains('dd')) { const next = n.nextElementSibling; card.appendChild(n); n = next; }
      if (group && group.nextElementSibling === h) { h.remove(); group.appendChild(card); }
      else { group = document.createElement('div'); group.className = 'dd'; h.replaceWith(group); group.appendChild(card); }
    });
  }

  /* ---------- Series nav: previous / next component, same A-Z order as the rail ---------- */
  function seriesNav(c) {
    const i = list.findIndex(x => x.slug === c.slug);
    const prev = list[i - 1], next = list[i + 1];
    if (!prev && !next) return '';
    const arrow = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${P.arrowRight}"/></svg>`;
    const item = (x, kind) => `<a class="sn-item sn-${kind}" href="#${esc(x.slug)}" rel="${kind}">
        <span class="sn-label">${kind === 'prev' ? arrow + 'Previous' : 'Next' + arrow}</span>
        <span class="sn-title">${esc(x.name)}</span></a>`;
    return `<nav class="series-nav${prev && next ? '' : ' is-single'}" aria-label="Previous and next components">${prev ? item(prev, 'prev') : ''}${next ? item(next, 'next') : ''}</nav>`;
  }

  /* ---------- Detail ---------- */
  async function renderDoc(c) {
    document.title = c.name + ' · Rivet 3 Component Guide';
    const actions = (c.figma ? `<a class="btn" href="${esc(c.figma)}" target="_blank" rel="noopener">Open in Figma${icon('arrowUpRight')}</a>` : '') + `<button class="btn" type="button" id="jump-dev" hidden>Jump to developer specs${icon('arrowDown')}</button>`;
    app.innerHTML = hero({tag: '<a href="#">Components</a>', title: c.name, intro: c.summary, actions}) + `
      <nav class="wrap crumbs" aria-label="Breadcrumb"><ol>
        <li><a class="home" href="#" aria-label="Components home">${icon('home')}</a></li>
        <li><a href="#">Components</a></li>
        <li><span aria-current="page">${esc(c.name)}</span></li>
      </ol></nav>
      <main class="wrap detail">
        <article class="doc">${demoSection(c)}<div class="prose" id="prose"><p class="load">Loading…</p></div>
          ${seriesNav(c)}
          <footer class="doc-foot">
            <p>${c.updated ? 'Last updated ' + fmtDate(c.updated) : ''}</p>
          </footer>
        </article>
      </main>`;
    wireDemo(c);
    const prose = document.getElementById('prose');
    try {
      if (!cache[c.slug]) {
        const r = await fetch(`docs/${encodeURIComponent(c.slug)}.md`, {cache: 'no-store'});
        if (!r.ok) throw new Error(r.status);
        cache[c.slug] = await r.text();
      }
      if (location.hash.slice(1) !== c.slug) return;
      const html = marked.parse(preprocess(cache[c.slug]), {gfm: true, breaks: false});
      prose.innerHTML = DOMPurify.sanitize(html);
      enhance(prose);
      if (c.slug.startsWith('card-')) {
        const kind = c.slug.slice(5).toLowerCase();
        prose.querySelectorAll('table').forEach(t => {
          const col = [...t.querySelectorAll('thead th')].findIndex(th => th.textContent.trim().toLowerCase() === 'use');
          if (col < 0) return;
          t.querySelectorAll('tbody tr').forEach(tr => {
            const cell = tr.children[col];
            if (cell && cell.textContent.trim().toLowerCase() === kind) {
              tr.classList.add('is-current');
              cell.insertAdjacentHTML('beforeend', '<span class="sr-only"> (this card)</span>');
            }
          });
        });
      }
      prose.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      const devH = [...prose.querySelectorAll('h2')].find(h => /developer spec/i.test(h.textContent));
      const jump = document.getElementById('jump-dev');
      if (devH && jump) {
        jump.hidden = false;
        jump.addEventListener('click', () => {
          devH.setAttribute('tabindex', '-1');
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          devH.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
          devH.focus({preventScroll: true});
        });
      }
    } catch (e) {
      prose.innerHTML = `<p>This page's notes could not be loaded (docs/${esc(c.slug)}.md). Republish the component with <code>/doc-publish ${esc(c.slug)}</code>.</p>`;
    }
  }

  /* ---------- Token changes (JSON viewer) ---------- */
  let tokenJson = null;
  async function renderTokens() {
    document.title = 'Token guide · Rivet 3 Component Guide';
    app.innerHTML = hero({tag: '<a href="#">Components</a>', title: 'Figma to code token guide', intro: 'Figma is the source of truth. Every token has one name, used the same way in Figma and in code: --rvt- plus the Figma name. Start with toDo.',
      actions: `<button class="btn" type="button" id="copy-json">Copy JSON</button><button class="btn" type="button" id="copy-css">Copy tokens CSS</button><span id="copy-msg" role="status" style="color:#ffffff;font-size:14px"></span>`,
      aside: `<aside class="hero-card" aria-labelledby="naming-title">
        <h2 class="hero-card-title" id="naming-title">Naming adjustments</h2>
        <p class="hero-card-desc">Want a different name? Add it to the template and send it to Jenn. She'll rename it in Figma, and this guide and the tokens CSS will update to match.</p>
        <a class="btn btn-subtle" id="dl-template" href="rename-suggestions.json" download="rename-suggestions.json">Download the template${icon('arrowDown')}</a><p class="hero-card-msg" id="dl-msg" role="status"></p>
      </aside>`}) + `
      <nav class="wrap crumbs" aria-label="Breadcrumb"><ol>
        <li><a class="home" href="#" aria-label="Components home">${icon('home')}</a></li>
        <li><a href="#">Components</a></li>
        <li><span aria-current="page">Token guide</span></li>
      </ol></nav>
      <main class="wrap detail"><div class="prose"><pre id="json-view" tabindex="0" aria-label="Token guide JSON"><code>Loading…</code></pre></div></main>`;
    const view = document.querySelector('#json-view code');
    try {
      if (!tokenJson) { const r = await fetch('token-changes.json', {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); tokenJson = await r.text(); }
      if (location.hash.slice(1) !== 'token-changes') return;
      view.textContent = tokenJson;
    } catch (e) { view.textContent = 'The JSON file could not be loaded. Try reloading the page.'; }
    const fetchText = async path => { const r = await fetch(path, {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); return r.text(); };
    document.getElementById('copy-css').addEventListener('click', async () => {
      const msg = document.getElementById('copy-msg');
      try {
        const cssText = await fetchText('generated/rivet-tokens.css');
        try { await navigator.clipboard.writeText(cssText); msg.textContent = 'Tokens CSS copied.'; return; } catch (e) {}
        const a = document.createElement('a'); a.href = 'generated/rivet-tokens.css'; a.download = 'rivet-tokens.css'; document.body.appendChild(a); a.click(); a.remove();
        msg.textContent = 'Copy is blocked here, so the CSS file was downloaded instead.';
      } catch (e) { msg.textContent = e && e.code === 'declined' ? '' : 'Could not copy the CSS. Try reloading the page.'; }
    });
    document.getElementById('copy-json').addEventListener('click', () => {
      const msg = document.getElementById('copy-msg');
      const select = () => { const r = document.createRange(); r.selectNodeContents(view); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      if (!tokenJson) return;
      (navigator.clipboard ? navigator.clipboard.writeText(tokenJson) : Promise.reject())
        .then(() => { msg.textContent = 'Copied.'; }, () => { select(); msg.textContent = 'Copy is blocked here. The JSON is selected: press Ctrl/Cmd+C.'; });
    });
  }

  /* ---------- Text styles and tokens (guides/text-styles.md) ---------- */
  let typeMd = null;
  async function renderTextStyles(jumpToTokens = false) {
    document.title = 'Text styles and tokens · Rivet 3 Component Guide';
    app.innerHTML = hero({tag: '<a href="#">Components</a>', title: 'Text styles and tokens', intro: 'The type scale, the math behind each size, the reasoning for each group of text styles, and how the tokens are organized.',
      actions: `<a class="btn" href="#token-changes">Updated token guide${icon('arrowRight')}</a>`}) + `
      <nav class="wrap crumbs" aria-label="Breadcrumb"><ol>
        <li><a class="home" href="#" aria-label="Components home">${icon('home')}</a></li>
        <li><a href="#">Components</a></li>
        <li><span aria-current="page">Text styles and tokens</span></li>
      </ol></nav>
      <main class="wrap detail"><article class="doc"><div class="prose" id="prose"><p class="load">Loading…</p></div></article></main>`;
    const prose = document.getElementById('prose');
    try {
      if (!typeMd) { const r = await fetch('guides/text-styles.md', {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); typeMd = await r.text(); }
      if (!['text-styles', 'token-details'].includes(location.hash.slice(1))) return;
      prose.innerHTML = DOMPurify.sanitize(marked.parse(preprocess(typeMd), {gfm: true, breaks: false}));
      enhance(prose);
      if (jumpToTokens) {
        const h = [...prose.querySelectorAll('h2')].find(x => /^token/i.test(x.textContent));
        if (h) { h.setAttribute('tabindex', '-1'); h.scrollIntoView({behavior: 'auto', block: 'start'}); h.focus({preventScroll: true}); }
      }
    } catch (e) { prose.innerHTML = '<p>This page could not be loaded. Try reloading the page.</p>'; }
  }

  /* ---------- Component rail ---------- */
  const CHEV = 'M6.263 15.146 12.31 8 6.263.854 4.737 2.146 9.69 8l-4.953 5.854 1.526 1.292Z';
  const BACK = 'M15 7H4.156l4.107-4.854L6.737.854.69 8l6.047 7.146 1.526-1.292L4.156 9H15V7Z';
  const MENU = 'M15 4H1V2H15V4ZM15 9H1V7H15V9ZM1 14H15V12H1V14Z';
  let railToggle, railPanel, railNav;
  const desktop = window.matchMedia('(min-width: 1024px)');
  function buildRail() {
    const shell = document.createElement('div');
    shell.id = 'rail-shell';
    shell.innerHTML = `
      <nav id="rail" aria-label="All components"><div id="rail-nav">
        <a class="rail-back" href="#"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="${BACK}"/></svg><span>Home</span></a>
        <div class="rail-after-back"><a class="rail-title" href="#"><span class="rail-title-label">Components</span></a>
        <ul>${list.map(c => `<li><a class="rail-item" href="#${esc(c.slug)}" data-slug="${esc(c.slug)}"><span class="rail-label">${esc(c.name)}</span></a></li>`).join('')}</ul>
      </div></div></nav>`;
    app.parentNode.insertBefore(shell, app);
    document.getElementById('rail-toggle').hidden = false;
    railToggle = document.getElementById('rail-toggle');
    railPanel = document.getElementById('rail');
    railNav = document.getElementById('rail-nav');
    railToggle.addEventListener('click', () => setRailOpen(railToggle.getAttribute('aria-expanded') !== 'true'));
    shell.addEventListener('keydown', e => {
      if (e.key === 'Escape' && railToggle.getAttribute('aria-expanded') === 'true') { setRailOpen(false); railToggle.focus(); }
    });
    desktop.addEventListener('change', () => setRailOpen(false));
  }
  function setRailOpen(open) {
    if (!railToggle) return;
    railToggle.setAttribute('aria-expanded', String(open));
    railPanel.classList.toggle('is-open', open);
    railPanel.style.maxHeight = open ? railNav.offsetHeight + 'px' : '';
  }
  function markRail(slug) {
    if (!railPanel) return;
    let cur = null;
    railPanel.querySelectorAll('.rail-item').forEach(a => {
      const on = a.dataset.slug === slug;
      if (on) { a.setAttribute('aria-current', 'page'); cur = a; } else a.removeAttribute('aria-current');
    });
    // Keep the current component in view inside the rail (desktop rail scrolls on its own).
    if (cur && desktop.matches) {
      const top = cur.offsetTop, h = cur.offsetHeight, st = railPanel.scrollTop, ch = railPanel.clientHeight;
      if (top < st || top + h > st + ch) railPanel.scrollTop = Math.max(0, top - ch / 2 + h / 2);
    }
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const c = slug && list.find(x => x.slug === slug);
    const onDoc = slug !== 'token-changes' && !!c;
    /* Page theme switcher: only pages with an example have one. Entering such a page starts on Dark; leaving it clears the choice. */
    if (c && demos[c.slug]) { const ds = document.documentElement.dataset; if (!ds.pageTheme || 'systemTheme' in ds) setTheme(DEFAULT_THEME); }
    else clearTheme();
    document.body.classList.toggle('has-rail', onDoc);
    setRailOpen(false);
    markRail(onDoc ? c.slug : null);
    if (slug === 'token-changes') renderTokens(); else if (slug === 'text-styles' || slug === 'token-details') renderTextStyles(slug === 'token-details'); else if (c) renderDoc(c); else renderIndex();
    window.scrollTo(0, 0);
  }

  // Header shadow: on while the page is scrolled away from the top.
  const siteHeader = document.getElementById('site-header');
  const syncHeaderShadow = () => siteHeader.classList.toggle('is-scrolled', window.scrollY > 0);
  window.addEventListener('scroll', syncHeaderShadow, {passive: true});
  syncHeaderShadow();

  loadManifest().then(() => { buildRail(); route(); window.addEventListener('hashchange', route); })
    .catch(() => { app.innerHTML = '<div class="wrap load">The component list could not be loaded. Try reloading the page.</div>'; });
})();
</script>

</body>
</html>
