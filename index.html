        const h = [...prose.querySelectorAll('h2')].find(x => /^token/i.test(x.textContent));
        if (h) { h.setAttribute('tabindex', '-1'); h.scrollIntoView({behavior: 'auto', block: 'start'}); h.focus({preventScroll: true}); }
      }
    } catch (e) { prose.innerHTML = '<p>This page could not be loaded. Try reloading the page.</p>'; }
  }

  /* ---------- Component rail ---------- */
  const CHEV = 'M6.263 15.146 12.31 8 6.263.854 4.737 2.146 9.69 8l-4.953 5.854 1.526 1.292Z';
  const MENU = 'M15 4H1V2H15V4ZM15 9H1V7H15V9ZM1 14H15V12H1V14Z';
  let railToggle, railPanel, railNav;
  const desktop = window.matchMedia('(min-width: 1024px)');
  function buildRail() {
    const shell = document.createElement('div');
    shell.id = 'rail-shell';
    shell.innerHTML = `
      <div class="rail-bar">
        <a class="rail-bar-title" href="#">Component Guide</a>
        <button type="button" id="rail-toggle" aria-expanded="false" aria-controls="rail">
          <svg class="rail-ic-menu" viewBox="0 0 16 16" aria-hidden="true"><path d="${MENU}"/></svg>
          <svg class="rail-ic-close" viewBox="0 0 16 16" aria-hidden="true"><path d="${P.close}"/></svg>
          <span class="sr-only">All components</span>
        </button>
      </div>
      <nav id="rail" aria-label="All components"><div id="rail-nav">
        <a class="rail-title" href="#"><span class="rail-title-label">Components</span></a>
        <ul>${list.map(c => `<li><a class="rail-item" href="#${esc(c.slug)}" data-slug="${esc(c.slug)}"><span class="rail-label">${esc(c.name)}</span><span class="rail-chev" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="${CHEV}"/></svg></span></a></li>`).join('')}</ul>
      </div></nav>`;
    document.body.insertBefore(shell, app);
    railToggle = document.getElementById('rail-toggle');
    railPanel = document.getElementById('rail');
    railNav = document.getElementById('rail-nav');
    railToggle.addEventListener('click', () => setRailOpen(railToggle.getAttribute('aria-expanded') !== 'true'));
    shell.addEventListener('keydown', e => {
      if (e.key === 'Escape' && railToggle.getAttribute('aria-expanded') === 'true') { setRailOpen(false); railToggle.focus(); }
    });
    desktop.addEventListener('change', () => setRailOpen(false));
  }
  function setRailOpen(open) {
    if (!railToggle) return;
    railToggle.setAttribute('aria-expanded', String(open));
    railPanel.classList.toggle('is-open', open);
    railPanel.style.maxHeight = open ? railNav.offsetHeight + 'px' : '';
  }
  function markRail(slug) {
    if (!railPanel) return;
    let cur = null;
    railPanel.querySelectorAll('.rail-item').forEach(a => {
      const on = a.dataset.slug === slug;
      if (on) { a.setAttribute('aria-current', 'page'); cur = a; } else a.removeAttribute('aria-current');
    });
    // Keep the current component in view inside the rail (desktop rail scrolls on its own).
    if (cur && desktop.matches) {
      const top = cur.offsetTop, h = cur.offsetHeight, st = railPanel.scrollTop, ch = railPanel.clientHeight;
      if (top < st || top + h > st + ch) railPanel.scrollTop = Math.max(0, top - ch / 2 + h / 2);
    }
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const c = slug && list.find(x => x.slug === slug);
    const onDoc = slug !== 'token-changes' && !!c;
    /* Page theme switcher: only pages with an example have one. Entering such a page starts on Dark; leaving it clears the choice. */
    if (c && demos[c.slug]) { if (!document.documentElement.dataset.pageTheme) setTheme(DEFAULT_THEME); }
    else clearTheme();
    document.body.classList.toggle('has-rail', onDoc);
    setRailOpen(false);
    markRail(onDoc ? c.slug : null);
    if (slug === 'token-changes') renderTokens(); else if (slug === 'text-styles' || slug === 'token-details') renderTextStyles(slug === 'token-details'); else if (c) renderDoc(c); else renderIndex();
    window.scrollTo(0, 0);
  }

  loadManifest().then(() => { buildRail(); route(); window.addEventListener('hashchange', route); })
    .catch(() => { app.innerHTML = '<div class="wrap load">The component list could not be loaded. Try reloading the page.</div>'; });
})();
</script>
